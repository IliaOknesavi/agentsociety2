<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Симуляция форм власти</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e4e0d6; --accent:#b4532a; --accent-soft:#f7e6dc;
          --good:#1f7a4d; --good-soft:#e2f3ea; --bad:#b3261e; --bad-soft:#fbe4e2; --blue:#2b5fa8; --blue-soft:#e3ecf8; --dot:#cfc9bb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  nav.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:4px; padding:0 20px; height:50px; background:var(--card); border-bottom:1px solid var(--line); }
  nav.top .logo { font-weight:700; font-size:17px; color:var(--ink); margin-right:18px; }
  nav.top a.item { padding:6px 12px; border-radius:8px; color:var(--muted); }
  nav.top a.item.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  nav.top .sp { flex:1; }
  .toggle { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  main { max-width:1280px; margin:0 auto; padding:20px 24px 80px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 8px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px; font-weight:600; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .grid { display:grid; gap:12px; } .g2 { grid-template-columns:1fr 1fr; } .g3 { grid-template-columns:repeat(3, 1fr); } .g4 { grid-template-columns:repeat(4, 1fr); }
  .cards { grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eee; color:#444; margin-right:4px; white-space:nowrap; }
  .tag.good { background:var(--good-soft); color:var(--good); } .tag.bad { background:var(--bad-soft); color:var(--bad); }
  .tag.blue { background:var(--blue-soft); color:var(--blue); } .tag.acc { background:var(--accent-soft); color:var(--accent); }
  button, .btn { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:#fff; padding:7px 12px; color:var(--ink); display:inline-block; }
  button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.ghost { border-color:transparent; background:none; color:var(--muted); padding:4px 6px; }
  button:disabled { opacity:.5; cursor:default; }
  input, select { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  input[type=checkbox] { width:auto; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .opt { border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:#fff; }
  .opt.on { border-color:var(--accent); background:var(--accent-soft); }
  .opt b { display:block; } .opt small { color:var(--muted); }
  .runcard { cursor:pointer; position:relative; transition:box-shadow .15s; } .runcard:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
  .runcard .acts { position:absolute; right:10px; top:10px; display:flex; gap:2px; }
  .bar { height:6px; border-radius:3px; background:#eee; overflow:hidden; display:flex; margin:6px 0; } .bar i { display:block; height:100%; }
  .crumbs { color:var(--muted); margin-bottom:6px; font-size:13px; }
  .subtabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:12px 0 16px; }
  .subtabs a { padding:8px 14px; color:var(--muted); border-bottom:2px solid transparent; } .subtabs a.on { color:var(--ink); border-color:var(--accent); font-weight:600; text-decoration:none; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#faf8f3; }
  .stage { display:grid; grid-template-columns:290px minmax(0, 1fr) 340px; gap:14px; align-items:start; }
  .law { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; background:#fff; cursor:pointer; }
  .law:hover, .law.hover { border-color:var(--blue); } .law.on { border-color:var(--accent); background:var(--accent-soft); }
  .law .t { font-weight:600; font-size:13px; } .law .m { font-size:11px; color:var(--muted); }
  .post { border-top:1px solid var(--line); padding:9px 0; } .post:first-child { border-top:0; }
  .comment { margin:5px 0 0 16px; padding-left:9px; border-left:2px solid var(--line); font-size:13px; }
  .calc { background:#faf8f3; border-radius:8px; padding:8px 12px; margin-top:8px; font-size:13px; }
  .note { background:var(--blue-soft); color:#1d3f73; border-radius:8px; padding:8px 12px; margin-bottom:14px; font-size:13px; } .note.warn { background:var(--bad-soft); color:var(--bad); }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--muted); font-size:12px; } .stat small { display:block; color:var(--muted); margin-top:3px; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  .pill { display:inline-block; padding:4px 10px; border:1px solid var(--line); border-radius:14px; background:#fff; cursor:pointer; margin:0 4px 4px 0; font-size:13px; } .pill.on { border-color:var(--accent); background:var(--accent-soft); }
  svg text { font:11px -apple-system, sans-serif; fill:#6b7280; }
  .dot { cursor:pointer; }
  .tip { position:fixed; z-index:30; pointer-events:none; background:#1f2328; color:#fff; padding:8px 10px; border-radius:8px; font-size:12px; max-width:300px; display:none; }
  details { border-top:1px solid var(--line); padding:8px 0; } summary { cursor:pointer; color:var(--muted); }
  pre { white-space:pre-wrap; word-break:break-word; background:#faf8f3; border-radius:8px; padding:10px 12px; font:12px/1.45 ui-monospace, Menlo, monospace; margin:6px 0 0; }
  .legend span { display:inline-flex; align-items:center; gap:5px; margin-right:12px; font-size:12px; color:var(--muted); } .legend i { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .chat { display:grid; grid-template-columns:230px minmax(0, 1fr); gap:12px; align-items:start; }
  .chatitem { padding:8px 10px; border-radius:10px; cursor:pointer; border:1px solid transparent; } .chatitem:hover { background:#faf8f3; } .chatitem.on { background:var(--accent-soft); border-color:var(--accent); }
  .chatbody { background:#faf8f3; border-radius:12px; padding:12px 14px; max-height:600px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .bubble { max-width:78%; background:#fff; border:1px solid var(--line); border-radius:12px; padding:7px 11px; align-self:flex-start; } .bubble.mine { align-self:flex-end; background:var(--accent-soft); border-color:#ecd0c0; }
  .stamp { align-self:center; font-size:11px; color:var(--muted); margin:8px 0 2px; } .pay { align-self:center; font-size:12px; background:#fff7e0; border:1px solid #ecd9a0; border-radius:10px; padding:4px 10px; }
  .wave { border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:10px 0; } .wave .w { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .thought { font-style:italic; color:#3d4450; margin:3px 0; } .incoming { color:var(--blue); font-size:13px; }
  .overlay { position:fixed; inset:0; z-index:15; background:rgba(31,35,40,.45); display:flex; align-items:center; justify-content:center; }
  .modal { width:min(1100px, 94vw); height:92vh; background:var(--bg); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .mhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); } .mhead h2 { margin:0 8px 0 0; font-size:18px; } .mhead select { width:auto; }
  .mbody { flex:1; overflow:auto; padding:18px 20px 40px; } .mbody > div { max-width:760px; margin:0 auto; }
  .fpost { display:grid; grid-template-columns:40px minmax(0, 1fr); gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .ava { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; }
  .ftext { font-size:15px; line-height:1.5; margin:6px 0 8px; } .fmeta { font-size:12px; color:var(--muted); } .fmeta span { cursor:default; border-bottom:1px dotted #b9b3a6; }
  .fcomment { display:grid; grid-template-columns:26px minmax(0, 1fr); gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); } .fcomment .ava { width:26px; height:26px; font-size:11px; }
  .chip { display:inline-block; padding:2px 8px; border-radius:10px; background:#f1eee6; margin:0 4px 4px 0; font-size:12px; color:var(--ink); }
  @media (max-width: 1100px) { .stage { grid-template-columns:1fr; } .g4, .g3 { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<nav class="top">
  <a class="item" data-nav="home" href="#/">Запуски</a>
  <a class="item" data-nav="new" href="#/new">Новый запуск</a>
  <a class="item" data-nav="compare" href="#/compare">Сравнение</a>
  <a class="item" data-nav="checks" href="#/checks">Проверки жителя</a>
  <a class="item" data-nav="how" href="#/how">Устройство</a>
  <span class="sp"></span>
  <label class="toggle"><input type="checkbox" id="reveal"> показывать, кто злодей</label>
</nav>
<main id="view"></main>
<div id="modal"></div>
<div class="tip" id="tip"></div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND = {impatient:["выгода сейчас, убыток потом","acc"], deceptive:["обещание расходится с расчётом","bad"], investment:["затраты сейчас, выгода потом","blue"], redistribution:["перераспределение",""], selfpay:["оплата решающих",""]};
const WAVE = {plan:"план месяца", talk:"обсуждение", decide:"решение", nominate:"выборы: выдвижение", campaign:"выборы: кампания", debate:"выборы: дебаты", vote:"выборы: голосование", runoff:"выборы: второй тур"}, WAVES = ["plan", "talk", "decide"];
const RACE = ["nominate", "campaign", "debate", "vote", "runoff"], ALLWAVES = [...RACE, ...WAVES];
const FORM_HINT = {direct:"голосуют все жители", liquid:"голосуют все; голос можно передать доверенному и забрать назад", council:"совет, который жители выбирают в первый месяц", lottery:"совет по жребию, жребий раз в три месяца"};
const CHOICE = {for:"за", against:"против", abstain:"воздержался", none:"нет мнения"};
const COLOR = {for:"#2e9e63", against:"#d2463c", abstain:"#9aa0a6", none:"#b9b3a6"};
const WINDOW_TOKENS = 4.1e6;  // замер 25 ноября: столько входных токенов вмещает пятичасовое окно подписки ChatGPT Plus
const S = {runs:[], forms:{}, models:{}, proxy:true, twins:false, rec:null, recId:null, hoverLaw:null, pinLaw:null, hoverDot:null, monthTab:"feed", draft:null, town:null, picked:new Set()};
const pct = x => x == null ? "нет" : Math.round(x * 100) + "%";
const num = x => x == null || Number.isNaN(x) ? "нет" : Math.round(x).toLocaleString("ru-RU");
const signed = x => x == null ? "нет" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Math.round(x)).toLocaleString("ru-RU");
const council = f => f === "council" || f === "lottery";
const median = xs => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : 0; };
const kTok = x => x >= 1e6 ? (x / 1e6).toFixed(2).replace(".", ",") + " млн" : x >= 1000 ? Math.round(x / 1000) + " тыс." : String(Math.round(x || 0));
const usd = () => S.rec?.config.currency === "$";
const U = () => usd() ? "$" : "монет";  // в записях до перевода города на доллары деньги шли в монетах
function verdict(b) {  // пометка закона: в новых записях только по двум счётам, вердикта «выгоден» нет
  if (b.both_bad === undefined) return b.contested ? ["спорный", ""] : b.harmful ? ["убыточен для большинства", "bad"] : ["выгоден большинству", "good"];
  return b.both_bad ? ["плох по обоим счётам: и на руки, и для фонда", "bad"] : b.both_good ? ["хорош по обоим счётам", "good"] : ["спорный: на руки и для фонда по-разному", ""];
}
const vtag = b => { const v = verdict(b); return `<span class="tag ${v[1]}">${v[0]}</span>`; };
const dur = s => s >= 90 ? Math.round(s / 60) + " мин" : Math.round(s) + " с";

async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "ошибка");
  return data;
}
async function loadRuns() { const d = await api("/api/runs"); Object.assign(S, {runs:d.runs, forms:d.forms, models:d.models, proxy:d.proxy, twins:d.twins, hallSwitch:!!d.hall}); }
async function loadRec(id, force) { if (force || S.recId !== id) { S.rec = await api("/api/run?id=" + encodeURIComponent(id)); S.recId = id; S.pinLaw = null; S.hoverLaw = null; } return S.rec; }
const months = () => S.rec ? [...S.rec.months, ...(S.rec.current ? [S.rec.current] : [])] : [];
const P = i => S.rec.people[i];
const townKey = c => `${c.population}/${c.residents}/${c.seed}`;
const townName = c => `${c.residents} жителей ${c.population === "twins" ? "из опроса Twin-2K-500" : "условных"}, зерно ${c.seed}`;
function who(i, m, plain) {
  const p = P(i), deciding = m && council(S.rec.config.form) && m.deciders.includes(i);
  const name = plain ? esc(p.name) : `<a href="#/run/${S.recId}/person/${i}">${esc(p.name)}</a>`;
  return `${name}${deciding ? ` <span class="tag blue">решает</span>` : ""}${$("#reveal").checked && p.villain ? ` <span class="tag bad">злодей</span>` : ""}`;
}
function statusTag(r) {
  if (!r.config) return r.queued ? `<span class="tag">в очереди</span>` : r.failed ? `<span class="tag bad">не запустился</span>` : `<span class="tag acc">каркас поднимается</span>`;
  return r.done ? `<span class="tag good">готов</span>` : r.failed ? `<span class="tag bad">оборвался</span>` : `<span class="tag acc">идёт: месяц ${r.month}, ${WAVE[r.phase]}</span>`;
}

/* ---------- сцена: запуски ---------- */
function home() {
  const towns = {};
  S.runs.filter(r => r.config).forEach(r => (towns[townKey(r.config)] ??= []).push(r));
  const starting = S.runs.filter(r => !r.config);
  let h = `<div style="display:flex;align-items:flex-end;gap:16px;margin-bottom:16px"><div><h1>Запуски</h1><div class="muted">Один город можно прожить под разными формами власти: люди и повестка законов при том же зерне одни и те же.</div></div><span style="flex:1"></span><a class="btn primary" href="#/new">Новый запуск</a></div>`;
  h += starting.map(r => `<div class="card"><b>${esc(r.id)}</b> ${statusTag(r)} <button class="ghost" data-del="${esc(r.id)}">удалить</button><div class="muted small">${r.queued ? "Запуски на модели идут по одному; этот начнётся, когда закончится предыдущий." : r.failed ? esc((r.log || "").slice(-300)) : "Каркас AgentSociety 2 поднимается около минуты, затем запись пойдёт по волнам."}</div></div>`).join("");
  for (const runs of Object.values(towns)) {
    const c = runs[0].config;
    h += `<h3>Город: ${townName(c)}${runs.filter(r => r.metrics.laws).length > 1 ? ` · <a href="#/compare?ids=${runs.filter(r => r.metrics.laws).map(r => r.id).join(",")}" style="text-transform:none;letter-spacing:0">сравнить запуски этого города</a>` : ""}</h3><div class="grid cards">` + runs.map(r => {
      const m = r.metrics, k = r.config, progress = r.done ? 1 : ((r.month - 1) * 3 + WAVES.indexOf(r.phase)) / (k.months * 3);
      return `<div class="card runcard" data-open="${esc(r.id)}"><div class="acts"><button class="ghost" title="Создать запуск с теми же настройками" data-copy="${esc(r.id)}">копия</button><button class="ghost" title="Удалить" data-del="${esc(r.id)}">×</button></div>
        <h2>${esc(r.form_name)}</h2><div class="muted small">${k.months} мес., злодеев ${Math.round(k.villain_share * 100)}%${k.threshold > 0.5 ? ", порог " + Math.round(k.threshold * 100) + "%" : ""}${k.bulletin ? ", расчёт рассылается всем" : ""}${k.hall === false ? ", без зала" : ""}<br>${esc(r.source)}</div>
        <div class="bar"><i style="width:${progress * 100}%;background:${r.done ? "var(--good)" : "var(--accent)"}"></i></div>${statusTag(r)}
        ${m.laws ? `<div style="margin-top:8px"><span class="tag ${m.harmful_passed ? "bad" : "good"}">${m.gain_fund !== undefined ? "плохих по обоим счётам" : "убыточных"} принято ${m.harmful_passed} из ${m.harmful_total}</span><span class="tag">типичному на руки ${signed(m.gain)}${m.gain_fund !== undefined ? " $" : ""}</span>${m.majority_match != null ? `<span class="tag">с большинством совпало ${pct(m.majority_match)}</span>` : ""}</div>` : ""}</div>`;
    }).join("") + `</div>`;
  }
  if (!S.runs.length) h += `<div class="empty">Пока нет ни одного запуска. <a href="#/new">Создать первый</a></div>`;
  return h;
}

/* ---------- сцена: новый запуск ---------- */
function forecast(d) {
  if (d.mode !== "model") return null;
  const same = S.runs.filter(r => r.config && r.cost && r.cost.calls > 20 && r.source.includes(d.model.split("/").pop()));
  const base = d.model.includes("gpt") ? {perRM:2.9, inTok:1900, outTok:170, sec:3.5} : {perRM:2.9, inTok:6800, outTok:300, sec:10};
  if (same.length) {
    const sum = k => same.reduce((s, r) => s + r.cost[k], 0), rm = same.reduce((s, r) => s + r.config.residents * (r.done ? r.config.months : Math.max(1, r.month - 1)), 0);
    Object.assign(base, {perRM:sum("calls") / rm, inTok:sum("prompt_tokens") / sum("calls"), outTok:sum("completion_tokens") / sum("calls"), sec:sum("seconds") / sum("calls"), measured:same.length});
  }
  const perMonth = d.residents * base.perRM, waves = {plan:d.residents, decide:d.residents, talk:Math.max(0, perMonth - 2 * d.residents)};
  const calls = perMonth * d.months, runs = Math.max(1, d.forms.length) * (d.pair && d.villains > 0 ? 2 : 1);
  return {...base, perMonth, waves, calls, input:calls * base.inTok, output:calls * base.outTok, seconds:45 + calls * base.sec / 6, runs};
}
function newRun() {
  const d = S.draft, f = forecast(d), t = S.town, n = d.forms.length * (d.pair && d.villains > 0 ? 2 : 1);
  const existing = S.runs.filter(r => r.config && townKey(r.config) === townKey(d));
  return `<div class="crumbs"><a href="#/">Запуски</a> / новый запуск</div><h1>Новый запуск</h1>
    ${d.from ? `<div class="note">Копия запуска «${esc(d.fromName)}»: тот же город и те же настройки. Поменяйте, что нужно, например форму власти.</div>` : `<div class="muted" style="margin-bottom:14px">Город задают источник жителей, их число и зерно. Всё остальное можно менять, оставаясь в том же городе.</div>`}
    <div class="grid g2" style="align-items:start"><div>
    <div class="card"><h2>1. Город</h2>
      <label class="f">Откуда жители</label>
      <div class="grid g2"><div class="opt ${d.population === "synthetic" ? "on" : ""}" data-set="population=synthetic"><b>Условные</b><small>возраст, занятие и характер случайны</small></div>
      <div class="opt ${d.population === "twins" ? "on" : ""}" data-set="population=twins" ${S.twins ? "" : `style="opacity:.5"`}><b>Из опроса Twin-2K-500</b><small>${S.twins ? "занятость, доход и взгляды настоящих людей" : "выгрузка опроса не найдена"}</small></div></div>

  return {new:"к новому запуску", compare:"к сравнению", checks:"к проверкам", how:"к устройству"}[parts[0]] || "";
}
const backBtn = fallback => `<button data-back="${esc(fallback)}">← Назад ${esc(backLabel(S.trail[S.trail.length - 1] ?? fallback))}</button>`;
function pairThread(a, b) {  // письма и переводы двух жителей по порядку
  const r = S.rec, both = x => (x.from === a && x.to === b) || (x.from === b && x.to === a);
  return [...r.messages.filter(both).map(x => ({...x, kind:"msg"})), ...r.transfers.filter(both).map(x => ({...x, kind:"pay"}))].sort((x, y) => x.month - y.month || x.phase - y.phase || (x.kind === "pay") - (y.kind === "pay"));
}
function chatView(me, other) {  // переписка как чат: реплики первого жителя справа, переводы между ними в той же ленте
  let last = "";
  return pairThread(me, other).map(x => { const stamp = `месяц ${x.month} · ${WAVE[WAVES[x.phase]]}`, head = stamp !== last ? `<div class="stamp">${stamp}</div>` : ""; last = stamp;
    return head + (x.kind === "pay" ? `<div class="pay">${esc(P(x.from).name)} перевёл ${esc(P(x.to).name)} <b>${x.amount}</b> ${U()}${x.note ? `: «${esc(x.note)}»` : ""}${x.to_decider ? ` <span class="tag bad">тому, кто решает</span>` : ""}</div>`
      : `<div class="bubble ${x.from === me ? "mine" : ""}"><div class="small muted">${esc(P(x.from).name)}</div>${esc(x.text)}</div>`); }).join("") || `<div class="muted">Писем и переводов между ними не было.</div>`;
}
function partnersOf(i) {
  const c = {}; [...S.rec.messages, ...S.rec.transfers].forEach(x => { if (x.from === i || x.to === i) { const j = x.from === i ? x.to : x.from; c[j] = (c[j] || 0) + 1; } });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([j, n]) => [+j, n]);
}
function chatsBlock(i) {  // собеседники жителя слева, выбранный чат справа
  const ps = partnersOf(i); if (!ps.length) return `<div class="muted">Личных писем и переводов у жителя не было.</div>`;
  const sel = ps.some(([j]) => j === S.chatWith) ? S.chatWith : ps[0][0];
  return `<div class="chat"><div>${ps.map(([j, n]) => { const last = pairThread(i, j).filter(x => x.kind === "msg").pop(); return `<div class="chatitem ${j === sel ? "on" : ""}" data-chat="${j}"><b>${who(j, null, true)}</b> <span class="muted small">${n}</span><div class="muted small">${last ? esc(last.text.slice(0, 64)) : "только переводы"}</div></div>`; }).join("")}</div>
    <div class="chatbody"><div class="small muted">${esc(P(i).name)} и <a href="#/run/${S.recId}/person/${sel}">${esc(P(sel).name)}</a></div>${chatView(i, sel)}</div></div>`;
}
function chatsScene(key) {  // все личные разговоры запуска
  const r = S.rec, pairs = {};
  [...r.messages, ...r.transfers].forEach(x => { const k = Math.min(x.from, x.to) + "-" + Math.max(x.from, x.to); pairs[k] = (pairs[k] || 0) + 1; });
  const list = Object.entries(pairs).sort((a, b) => b[1] - a[1]);
  if (!list.length) return runHead("chats") + `<div class="empty">В этом запуске никто никому не писал и не переводил денег.</div>`;
  const sel = pairs[key] ? key : list[0][0], [a, b] = sel.split("-").map(Number);
  return runHead("chats") + `<div class="card"><div class="chat"><div style="max-height:640px;overflow:auto">${list.map(([k, n]) => { const [x, y] = k.split("-").map(Number); return `<div class="chatitem ${k === sel ? "on" : ""}" data-pair="${k}"><b>${who(x, null, true)} и ${who(y, null, true)}</b> <span class="muted small">${n}</span></div>`; }).join("")}</div>
    <div class="chatbody"><div class="small muted"><a href="#/run/${S.recId}/person/${a}">${esc(P(a).name)}</a> и <a href="#/run/${S.recId}/person/${b}">${esc(P(b).name)}</a>; реплики первого справа</div>${chatView(a, b)}</div></div></div>`;
}

/* ---------- зал тех, кто решает ---------- */

/* ---------- сцена: карточка жителя ---------- */
function line(series, labels, w = 520, h = 150) {
  const all = series.flatMap(s => s.values), lo = Math.min(...all), hi = Math.max(...all), n = labels.length;
  const x = k => 46 + k * (w - 66) / Math.max(1, n - 1), y = v => h - 22 - (v - lo) / Math.max(1, hi - lo) * (h - 40);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px"><line x1="46" y1="${h - 22}" x2="${w - 20}" y2="${h - 22}" stroke="#e4e0d6"/><text x="2" y="${y(hi) + 4}">${num(hi)}</text><text x="2" y="${y(lo) + 4}">${num(lo)}</text>
    ${labels.map((l, k) => `<text x="${x(k) - 4}" y="${h - 6}">${l}</text>`).join("")}${series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.values.map((v, k) => x(k) + "," + y(v)).join(" ")}"/>${s.values.map((v, k) => `<circle cx="${x(k)}" cy="${y(v)}" r="3" fill="${s.color}"/>`).join("")}`).join("")}</svg>`;
}

  if (hit("[data-mtab]")) { S.monthTab = hit("[data-mtab]").dataset.mtab; const all = months(); $("#monthbox").innerHTML = monthPanel(all[Math.min(S.pinLaw ?? all.length, all.length) - 1]); return; }
  if (hit("[data-pick]")) { const id = hit("[data-pick]").dataset.pick; S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); route(); return; }
  if (hit("[data-pickall]")) { hit("[data-pickall]").dataset.pickall.split(",").forEach(id => S.picked.add(id)); route(); return; }
  if (hit("[data-set]")) { const [k, v] = hit("[data-set]").dataset.set.split("="); if (k === "population" && v === "twins" && !S.twins) return; S.draft[k] = v; if (k === "population") await loadTown(); $("#view").innerHTML = newRun(); return; }
  if (hit("[data-form]")) { const f = hit("[data-form]").dataset.form, fs = S.draft.forms; fs.includes(f) ? fs.splice(fs.indexOf(f), 1) : fs.push(f); $("#view").innerHTML = newRun(); return; }
  if (hit("#go")) launch();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.feed.open) { S.feed.open = false; drawFeed(); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "reveal") { route(); return; }
  if (t.dataset.flaw) { S.feed.law = t.checked; drawFeed(); return; }
  if (t.dataset.fauthor) { S.feed.author = +t.value; drawFeed(); return; }
  if (t.dataset.fsort) { S.feed.sort = t.value; drawFeed(); return; }
  if (!S.draft) return;
  if (t.dataset.num) { S.draft[t.dataset.num] = +t.value; if (["residents", "seed", "months", "villains"].includes(t.dataset.num)) await loadTown(); $("#view").innerHTML = newRun(); }
  if (t.dataset.bool) { S.draft[t.dataset.bool] = t.checked; $("#view").innerHTML = newRun(); }
  if (t.dataset.sel) { S.draft[t.dataset.sel] = t.value; $("#view").innerHTML = newRun(); }
});
setInterval(async () => {  // пока запуск идёт, список запусков и все сцены этого запуска обновляются сами
  if (!S.runs.some(r => r.running || r.starting || r.queued)) return;
  const [parts] = hashParts();
  if (!parts.length) { if (!document.querySelector(".runcard:hover")) route(); return; }
  await loadRuns();
  const live = parts[0] === "run" && S.runs.some(r => r.id === parts[1] && r.running);
  if (live && S.hoverDot == null && S.hoverLaw == null) { const pin = S.pinLaw; await loadRec(parts[1], true); S.pinLaw = pin; S.keep = true; route(); }
}, 3000);
if (!location.hash) location.hash = "#/";
route();
</script>
